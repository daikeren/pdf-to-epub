name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pdf-to-epub
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Verify tag matches package version
        run: |
          package_version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Run tests
        run: uv run --locked --extra dev pytest -q

      - name: Build distributions
        run: uv build

      - name: Smoke test wheel
        run: uvx --from dist/*.whl pdf-to-epub --help

      - name: Publish distributions
        run: uv publish --trusted-publishing always
